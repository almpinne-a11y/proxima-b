# Netlify : import du dépôt GitHub sans aucun réglage à saisir.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fichiers du build, dont le nom porte une empreinte : cache d'un an.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
